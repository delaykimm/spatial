# Experiment-tuning constants for the spatial/ pipeline, pulled out of the .py files so
# they can be read/edited in one place instead of hunting through 9 scripts. Each .py
# file that used to hardcode one of these values now loads it from here at import time
# and keeps the SAME module-level constant name (e.g. triplet_pipeline.PURITY_THRESH) --
# so every existing call site (cxp.PURITY_THRESH, ss.LAYER, ...) still works unchanged.
# Paths built from the file's own directory (DATA/RESULTS/PLOTS) stay in Python, since
# they aren't meaningfully "configurable" -- everything here is a tunable number/label.

models:
  default: qwen3vl
  configs:
    qwen3vl:
      model_id: Qwen/Qwen3-VL-8B-Instruct
      model_class: Qwen3VLForConditionalGeneration
      num_hidden_states: 37
      d: 4096
      suffix: ""
    llava:
      model_id: llava-hf/llava-1.5-7b-hf
      model_class: LlavaForConditionalGeneration
      num_hidden_states: 33
      d: 4096
      suffix: "_llava"
    qwen2:
      model_id: Qwen/Qwen2-VL-7B-Instruct
      model_class: Qwen2VLForConditionalGeneration
      num_hidden_states: 29
      d: 3584
      suffix: "_qwen2"
  prompt: "Where is {obj} located relative to {other}?"

axis_pipeline:
  aug1_shapes: [sphere, cube, cylinder, cone]
  aug1_colors: [red, blue, green, yellow, purple, orange]
  aug1_seed: {horizontal: 3042, vertical: 4042, closefar: 5042}
  aug1_n_scenes: 60
  heatmap_layer: 25

axis_steering:
  layer: 25
  n_items: 60
  seed: 7
  axis_key: {horizontal: x, vertical: y, closefar: z}
  posword: {horizontal: "to the right", vertical: "higher up in real-world 3D", closefar: "closer to the camera"}

spatial_rope_steering:
  layer: 25       # rotate each object's own token span in this layer's OUTPUT (feeds layer+1 onward)
  n_items: 60
  seed: 7
  companion_seed: 20260901  # fixed seed for the rotation-plane companion vector (reproducible across runs)

cross_axis_analysis:
  default_layer: 25
  k_permtest: 1000
  seed: 0
  k_rand: 500
  seed_rand: 1
  report_layers_8: [1, 5, 10, 15, 20, 25, 30, 36]

cross_axis_alignment:
  k_permtest: 1000
  seed: 0
  report_layers_frac: [0.0, 0.14, 0.28, 0.42, 0.57, 0.71, 0.85, 1.0]
  model_display:
    qwen3vl: Qwen3-VL-8B-Instruct
    qwen2: Qwen2-VL-7B-Instruct
    llava: LLaVA-1.5-7B-hf
  ext_axis_flip: [closefar]  # axes needing a sign flip when borrowed from an external dataset

cross_axis_readout_vqa:
  default_layer: 25
  axis_question_phrase:
    horizontal: "more to the right"
    vertical: "higher up"
    closefar: "farther from the camera"

cross_dataset_analysis:
  layer: 25

diffimage_steering:
  donor_offset: 17  # donor_idx = (scene_idx + donor_offset) % n_scenes, a deterministic
                     # different-scene pairing (see ours/binding's shuffled_scene_idx())

sameaxis_4way:
  seed: 777

diffpair_steering:
  layer: 25
  n_items: 40
  seed: 7
  pos_phrase:
    horizontal: "more to the right"
    vertical: "higher up"
    closefar: "farther from the camera (more towards the back)"

triplet_pipeline:
  purity_thresh: 0.85     # |cos| >= 0.85 <=> leg within ~31.8 deg of the target axis
  min_diag_len: 0.5       # minimum ||A->C|| in the (horizontal,closefar) plane, world units
  clevr:
    n_per_config: 250
    seed: 42
  triplet3ax:
    n_per_config: 60
    obj_size: 0.8
    leg_len: {horizontal: [1.2, 2.0], closefar: [1.2, 2.0], vertical: [1.1, 1.6]}
    off_jitter: 0.22       # perpendicular jitter half-width -- purity stays well above 0.85
                           # even for the shortest leg (vertical, 1.1): 1.1/sqrt(1.1^2+0.22^2)=0.981
    min_dist_3d: 1.05      # overlap guard, matches triplet3ax_stimuli.py's convention
  sameaxis:
    n_per_axis: 60
    seed: {horizontal: 3042, vertical: 3142, closefar: 3242}
    x_jitter: 1.4
    x_jitter_closefar: 1.9  # wider -- closefar objects get stratified X lanes (sameaxis_closefar_lanes)
    min_gap_axis: {horizontal: 1.15, vertical: 0.55, closefar: 1.3}
    d_gap: 0.3              # min gap from A/C when forcing the distractor outside [A,C]

chain_hop:
  # N-hop random-walk chains on ONE axis (A->B->C->...), for hat_c_AZ = sum(c_i,i+1) vs
  # direct VQA on the endpoints, swept over hop count -- see chain_hop_pipeline.py.
  # horizontal/closefar only -- vertical's world range (Z_LO/Z_HI, span 2.3) is too narrow
  # to fit up to 7 well-separated objects (hop=6) without either losing single-axis purity
  # or overlapping; horizontal (span 5.0) and closefar (span 7.7) have enough room. Matches
  # clevr_chain_pipeline.py's 2-axis restriction, so both backends test the same 2 axes.
  hops: [2, 3, 4, 5, 6]
  n_scenes_per_hop: 40
  seed: {horizontal: 9042, closefar: 9242}
  step_range:              # per-hop step length (world units), before random +/- sign --
                            # must clear obj_min_dist_3d on its own (off-axis jitter is
                            # deliberately small, see off_jitter, so it can't rescue a too-
                            # short step the way it accidentally used to)
    horizontal: [0.65, 1.0]
    closefar: [0.95, 1.5]
  off_jitter: 0.3          # small perpendicular wobble (shared base +/- this), NOT
                            # sameaxis_world_pos's wide independent-per-object range --
                            # that used to swamp the (smaller) on-axis hop signal with
                            # irrelevant depth/position noise
  obj_size: 0.5            # smaller than triplet3ax's 0.8 -- leaves enough room for hop=6
                            # (7 objects) inside horizontal/closefar's world bounds
  obj_min_dist_3d: 0.68    # overlap guard, scaled down from triplet_pipeline.MIN_DIST_3D
                            # (1.05) to match this module's smaller obj_size
  min_net_disp_frac: 0.5  # min |scalar[-1]-scalar[0]| as a fraction of one step's min length --
                            # keeps the endpoint relation from being a near-zero coin-flip
  default_layer: 25

clevr_chain_hop:
  # same hat_c_AZ = sum(c_i,i+1) hop-count sweep, but chains are MINED from real CLEVR
  # photos (data/clevr_val_scenes.json's full 15,000-scene metadata) instead of rendered.
  # No collinearity/purity requirement -- A..Z is just N random objects from the scene in
  # random order (the additive-composition question doesn't need each leg to be pure along
  # one axis, only that the final A-vs-Z relation along that axis is non-trivial). Only 2
  # axes (CLEVR has no vertical position variation, same restriction as
  # triplet_pipeline.py's clevr triplets).
  hops: [2, 3, 4, 5, 6]
  n_scenes_per_hop: 40
  seed: {horizontal: 8042, closefar: 8242}
  min_diag_len: 0.5       # min |scalar_last - scalar_first| -- same threshold as triplet_pipeline.MIN_DIAG_LEN

multihop_referring:
  # GENUINE multi-hop MLLM generation test: the model must resolve a nested referring
  # expression ("the object right of the object left of ... A") to find Z, then tell it
  # apart from Y (one hop short) -- unlike chain_hop's direct "is Z more right than A?",
  # which never forces the model off a 2-object shortcut. Needs objects at SORTED, gapped
  # scalars (so "next object in that direction" is unambiguous) -- see
  # multihop_referring_pipeline.py.
  hops: [2, 3, 4, 5, 6]
  n_scenes_per_hop: 40
  seed: {horizontal: 10042, closefar: 10242}
  min_gap: {horizontal: 0.65, closefar: 0.95}  # min gap between adjacent-rank scalars
  off_jitter: 0.3
  obj_size: 0.5
  obj_min_dist_3d: 0.68
  dir_phrase:
    horizontal: {"+": "to the right of", "-": "to the left of"}
    closefar: {"+": "behind", "-": "in front of"}
  default_layer: 25
  seed_vqa: 13  # randomizes which slot (A/B) holds the true Z vs the Y distractor, per item
